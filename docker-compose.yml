version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: edustat
      POSTGRES_USER: edustat
      POSTGRES_PASSWORD: edustatpass
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    command: gunicorn edustat.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: production
      SECRET_KEY: changeme123
      DATABASE_URL: postgres://edustat:edustatpass@db:5432/edustat
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
